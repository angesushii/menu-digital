<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bebidas - Sushi Ange</title>
  <style>
    :root {
      --rojo:#d62828; --rojo-oscuro:#9d0208; --negro:#111;
      --texto:#1f1f1f; --sombra:0 10px 28px rgba(0,0,0,.12); --radio:22px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at top left,rgba(214,40,40,.14),transparent 32%),linear-gradient(180deg,#fff 0%,#f6f6f6 45%,#eee 100%);color:var(--texto);min-height:100vh}
    header{background:linear-gradient(135deg,#111,#2a2a2a);color:white;text-align:center;padding:28px 16px;border-bottom-left-radius:34px;border-bottom-right-radius:34px;box-shadow:var(--sombra)}
    header h1{margin:0;font-size:30px;text-transform:uppercase}
    header p{margin:8px 0 0;color:#eee}
    main{max-width:950px;margin:auto;padding:18px 14px 44px}
    .card{background:rgba(255,255,255,.96);border-radius:var(--radio);padding:16px;margin-bottom:16px;box-shadow:var(--sombra);border:1px solid rgba(0,0,0,.05)}
    .card h2{margin:0 0 6px;color:var(--rojo)}
    .muted{color:#666;font-size:14px;line-height:1.35}
    label{display:block;font-weight:900;margin-top:12px;margin-bottom:6px;font-size:14px}
    input,select{width:100%;padding:13px;border:1px solid #d7d7d7;border-radius:14px;font-size:15px;background:white;outline:none}
    input:focus,select:focus{border-color:var(--rojo);box-shadow:0 0 0 4px rgba(214,40,40,.10)}
    button{border:0;border-radius:14px;padding:12px 14px;font-weight:900;cursor:pointer;font-size:14px;transition:transform .12s ease,opacity .12s ease}
    button:active{transform:scale(.98)}
    .primary{width:100%;margin-top:14px;color:white;background:linear-gradient(135deg,var(--rojo),var(--rojo-oscuro))}
    .form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    .section-title{margin:22px 4px 12px;display:flex;align-items:center;gap:10px}
    .section-title span{background:var(--rojo);color:white;width:34px;height:34px;display:grid;place-items:center;border-radius:50%}
    .section-title h2{margin:0;font-size:22px}
    .bebidas-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    .bebida-card{background:white;border:1px solid #eee;border-radius:18px;padding:14px;box-shadow:0 6px 16px rgba(0,0,0,.07)}
    .bebida-card.sin-stock{background:#f2f2f2;color:#777}
    .bebida-card.inactiva{opacity:.65;filter:grayscale(.15)}
    .bebida-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:8px}
    .bebida-head strong{font-size:18px;color:var(--negro)}
    .bebida-card.sin-stock .bebida-head strong{color:#777;text-decoration:line-through}
    .badge{display:inline-block;padding:6px 9px;border-radius:999px;font-size:12px;font-weight:900;white-space:nowrap}
    .badge.ok{background:#e8f8ea;color:#1b7f3a;border:1px solid #7bc67e}
    .badge.low{background:#fff8e8;color:#7a5300;border:1px solid #f0d28a}
    .badge.out{background:#fff1f1;color:var(--rojo);border:1px solid rgba(214,40,40,.25)}
    .badge.off{background:#eee;color:#555;border:1px solid #ddd}
    .price{color:var(--rojo);font-weight:900;font-size:18px;margin-top:4px}
    .stock-line{margin-top:4px;font-weight:800;color:#555}
    .stock-actions{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
    .stock-actions button{padding:9px 6px;background:#111;color:white;font-size:13px}
    .card-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}
    .btn-edit{background:#111;color:white}.btn-toggle{background:#fff8e8;color:#7a5300;border:1px solid #f0d28a}.btn-delete{background:#fff1f1;color:var(--rojo);border:1px solid rgba(214,40,40,.18)}
    .status{margin-top:10px;color:#666;font-size:13px;font-weight:800}
    .empty{background:white;border-radius:18px;padding:16px;box-shadow:var(--sombra);color:#666;font-weight:800}
    @media(max-width:760px){.form-grid,.bebidas-grid,.card-actions{grid-template-columns:1fr}.stock-actions{grid-template-columns:repeat(3,1fr)}header h1{font-size:25px}}
  </style>
</head>
<body>
  <header>
    <h1>🥤 Bebidas</h1>
    <p>Inventario de bebidas de Sushi Ange</p>
  </header>
  <main>
    <section class="card">
      <h2 id="formTitulo">➕ Agregar bebida</h2>
      <div class="muted">Configura categoría, nombre, precio, stock y disponibilidad.</div>
      <div class="form-grid">
        <div><label>Categoría</label><select id="categoria"><option value="Lata 350 ml">Lata 350 ml</option><option value="Botella 591 ml">Botella 591 ml</option></select></div>
        <div><label>Nombre</label><input id="nombre" placeholder="Ej: Coca-Cola"></div>
        <div><label>Precio</label><input id="precio" type="number" min="0" step="100" placeholder="Ej: 1500"></div>
        <div><label>Stock</label><input id="stock" type="number" min="0" step="1" placeholder="Ej: 12"></div>
      </div>
      <button class="primary" onclick="guardarBebida()">Guardar bebida</button>
      <div id="formStatus" class="status"></div>
    </section>
    <div class="section-title"><span>🥫</span><h2>Latas 350 ml</h2></div>
    <div id="listaLatas" class="bebidas-grid"></div>
    <div class="section-title"><span>🧴</span><h2>Botellas 591 ml</h2></div>
    <div id="listaBotellas" class="bebidas-grid"></div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import { getFirestore, collection, doc, getDocs, setDoc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
    const firebaseConfig={apiKey:"AIzaSyDUMySSnAS5mpEFtncooBFn-268Z8LuD5Y",authDomain:"menu-sushi-ange.firebaseapp.com",projectId:"menu-sushi-ange",storageBucket:"menu-sushi-ange.firebasestorage.app",messagingSenderId:"1073224165075",appId:"1:1073224165075:web:913b3d109905faf6b61626"};
    const app=initializeApp(firebaseConfig); const db=getFirestore(app);
    window.db=db; window.collection=collection; window.doc=doc; window.getDocs=getDocs; window.setDoc=setDoc; window.updateDoc=updateDoc; window.deleteDoc=deleteDoc; window.onSnapshot=onSnapshot;
  </script>

  <script>
    const BEBIDAS_INICIALES=[
      {categoria:"Lata 350 ml",nombre:"Pepsi",precio:0,stock:0,activa:true},
      {categoria:"Lata 350 ml",nombre:"Bilz",precio:0,stock:0,activa:true},
      {categoria:"Lata 350 ml",nombre:"Kem",precio:0,stock:0,activa:true},
      {categoria:"Lata 350 ml",nombre:"Limón Soda",precio:0,stock:0,activa:true},
      {categoria:"Lata 350 ml",nombre:"Canada Dry",precio:0,stock:0,activa:true},
      {categoria:"Lata 350 ml",nombre:"Coca-Cola",precio:0,stock:0,activa:true},
      {categoria:"Lata 350 ml",nombre:"Coca-Cola Zero",precio:0,stock:0,activa:true},
      {categoria:"Botella 591 ml",nombre:"Coca-Cola",precio:0,stock:0,activa:true},
      {categoria:"Botella 591 ml",nombre:"Sprite",precio:0,stock:0,activa:true},
      {categoria:"Botella 591 ml",nombre:"Fanta",precio:0,stock:0,activa:true}
    ];
    let bebidas=[]; let editandoId=null;

    function slugBebida(categoria,nombre){return `${categoria}-${nombre}`.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}
    function formatCLP(valor){return "$"+Number(valor||0).toLocaleString("es-CL")}
    function estadoStock(b){if(b.activa===false)return{clase:"off",texto:"⚪ Inactiva"}; const s=Number(b.stock||0); if(s<=0)return{clase:"out",texto:"🔴 Sin stock"}; if(s<=3)return{clase:"low",texto:`🟡 Poco stock (${s})`}; return{clase:"ok",texto:`🟢 Disponible (${s})`}}

    async function crearBebidasInicialesSiFaltan(){
      const snap=await window.getDocs(window.collection(window.db,"bebidas"));
      const existentes=new Set(); snap.forEach(d=>existentes.add(d.id));
      for(const bebida of BEBIDAS_INICIALES){
        const id=slugBebida(bebida.categoria,bebida.nombre);
        if(!existentes.has(id)){
          await window.setDoc(window.doc(window.db,"bebidas",id),{...bebida,creadoEn:new Date().toISOString(),actualizadoEn:new Date().toISOString()},{merge:true});
        }
      }
    }

    function limpiarFormulario(){editandoId=null;document.getElementById("formTitulo").textContent="➕ Agregar bebida";document.getElementById("categoria").value="Lata 350 ml";document.getElementById("nombre").value="";document.getElementById("precio").value="";document.getElementById("stock").value="";document.getElementById("formStatus").textContent=""}

    window.guardarBebida=async function(){
      const categoria=document.getElementById("categoria").value;
      const nombre=document.getElementById("nombre").value.trim();
      const precio=Number(document.getElementById("precio").value||0);
      const stock=Number(document.getElementById("stock").value||0);
      if(!nombre){alert("Debes escribir el nombre de la bebida.");return}
      if(!Number.isFinite(precio)||precio<0){alert("Debes ingresar un precio válido.");return}
      if(!Number.isFinite(stock)||stock<0){alert("Debes ingresar un stock válido.");return}
      const id=editandoId||slugBebida(categoria,nombre);
      try{
        await window.setDoc(window.doc(window.db,"bebidas",id),{categoria,nombre,precio,stock,activa:true,actualizadoEn:new Date().toISOString()},{merge:true});
        document.getElementById("formStatus").textContent="Bebida guardada correctamente.";
        limpiarFormulario();
      }catch(e){console.error(e);alert("No se pudo guardar la bebida. Revisa las reglas de Firestore.")}
    };

    window.editarBebida=function(id){
      const b=bebidas.find(x=>x.id===id); if(!b)return;
      editandoId=id; document.getElementById("formTitulo").textContent="✏️ Editar bebida";
      document.getElementById("categoria").value=b.categoria||"Lata 350 ml"; document.getElementById("nombre").value=b.nombre||"";
      document.getElementById("precio").value=Number(b.precio||0); document.getElementById("stock").value=Number(b.stock||0);
      document.getElementById("formStatus").textContent="Editando bebida seleccionada."; window.scrollTo({top:0,behavior:"smooth"});
    };

    window.cambiarStock=async function(id,delta){
      const b=bebidas.find(x=>x.id===id); if(!b)return;
      const nuevo=Math.max(0,Number(b.stock||0)+delta);
      try{await window.updateDoc(window.doc(window.db,"bebidas",id),{stock:nuevo,actualizadoEn:new Date().toISOString()})}
      catch(e){console.error(e);alert("No se pudo cambiar el stock.")}
    };

    window.toggleActiva=async function(id){
      const b=bebidas.find(x=>x.id===id); if(!b)return;
      try{await window.updateDoc(window.doc(window.db,"bebidas",id),{activa:b.activa===false,actualizadoEn:new Date().toISOString()})}
      catch(e){console.error(e);alert("No se pudo cambiar la disponibilidad.")}
    };

    window.eliminarBebida=async function(id){
      const b=bebidas.find(x=>x.id===id); if(!b)return;
      if(!confirm(`¿Eliminar ${b.nombre} (${b.categoria})?`))return;
      try{await window.deleteDoc(window.doc(window.db,"bebidas",id))}
      catch(e){console.error(e);alert("No se pudo eliminar la bebida.")}
    };

    function renderBebidaCard(b){
      const e=estadoStock(b), sin=Number(b.stock||0)<=0, off=b.activa===false;
      return `<div class="bebida-card ${sin?"sin-stock":""} ${off?"inactiva":""}">
        <div class="bebida-head"><div><strong>${sin?"❌ ":""}${b.nombre}</strong><div class="price">${formatCLP(b.precio)}</div><div class="stock-line">Stock: ${Number(b.stock||0)}</div></div><span class="badge ${e.clase}">${e.texto}</span></div>
        <div class="stock-actions"><button onclick="cambiarStock('${b.id}',-1)">−1</button><button onclick="cambiarStock('${b.id}',1)">+1</button><button onclick="cambiarStock('${b.id}',6)">+6</button><button onclick="cambiarStock('${b.id}',12)">+12</button><button onclick="cambiarStock('${b.id}',24)">+24</button></div>
        <div class="card-actions"><button class="btn-edit" onclick="editarBebida('${b.id}')">Editar</button><button class="btn-toggle" onclick="toggleActiva('${b.id}')">${off?"Activar":"Desactivar"}</button><button class="btn-delete" onclick="eliminarBebida('${b.id}')">Eliminar</button></div>
      </div>`;
    }

    function renderBebidas(){
      const latas=bebidas.filter(b=>b.categoria==="Lata 350 ml");
      const botellas=bebidas.filter(b=>b.categoria==="Botella 591 ml");
      document.getElementById("listaLatas").innerHTML=latas.length?latas.map(renderBebidaCard).join(""):`<div class="empty">No hay latas configuradas.</div>`;
      document.getElementById("listaBotellas").innerHTML=botellas.length?botellas.map(renderBebidaCard).join(""):`<div class="empty">No hay botellas configuradas.</div>`;
    }

    function iniciarEscuchaBebidas(){
      window.onSnapshot(window.collection(window.db,"bebidas"),snap=>{
        bebidas=[]; snap.forEach(d=>bebidas.push({id:d.id,...d.data()}));
        bebidas.sort((a,b)=>String(a.categoria||"").localeCompare(String(b.categoria||""))||String(a.nombre||"").localeCompare(String(b.nombre||"")));
        renderBebidas();
      },e=>{console.error(e);alert("No se pudo cargar el inventario de bebidas.")});
    }

    async function iniciar(){await crearBebidasInicialesSiFaltan(); iniciarEscuchaBebidas();}
    iniciar();
  </script>
</body>
</html>
